﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>✨ 智能待办清单</title>
<style>
  :root {
    --bg: #eef4ff;
    --bg-2: #fff6fb;
    --card: rgba(255, 255, 255, 0.78);
    --card-solid: #ffffff;
    --text: #172033;
    --muted: #7d8aa3;
    --line: rgba(120, 142, 180, 0.22);
    --primary: #6366f1;
    --primary-2: #38bdf8;
    --accent: #f472b6;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --shadow: 0 24px 70px rgba(69, 89, 145, 0.18);
    --soft-shadow: 0 12px 34px rgba(69, 89, 145, 0.13);
    --radius: 26px;
    --ease: cubic-bezier(.2,.8,.2,1);
  }

  [data-theme="dark"] {
    --bg: #09111f;
    --bg-2: #171023;
    --card: rgba(22, 31, 50, 0.76);
    --card-solid: #141d30;
    --text: #eef4ff;
    --muted: #94a3b8;
    --line: rgba(148, 163, 184, 0.2);
    --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    --soft-shadow: 0 12px 38px rgba(0, 0, 0, 0.28);
  }

  [data-theme="dark"] body {
    background:
      radial-gradient(ellipse 90% 60% at 15% 0%, rgba(99, 102, 241, .20), transparent 45%),
      radial-gradient(ellipse 70% 50% at 88% 3%, rgba(56, 189, 248, .15), transparent 38%),
      radial-gradient(ellipse 85% 55% at 78% 92%, rgba(244, 114, 182, .13), transparent 40%),
      radial-gradient(ellipse 65% 45% at 12% 88%, rgba(167, 139, 250, .14), transparent 36%),
      radial-gradient(ellipse 75% 50% at 48% 52%, rgba(52, 211, 153, .08), transparent 50%),
      radial-gradient(ellipse 55% 38% at 42% 22%, rgba(251, 191, 36, .05), transparent 45%),
      linear-gradient(168deg, #09111f 0%, #0d1528 22%, #110f26 50%, #140f28 76%, #09111f 100%);
  }

  [data-theme="dark"] body::before {
    background:
      radial-gradient(ellipse 45% 40% at 28% 32%, rgba(99, 102, 241, .08) 0%, transparent 55%),
      radial-gradient(ellipse 38% 35% at 72% 25%, rgba(56, 189, 248, .06) 0%, transparent 50%),
      radial-gradient(ellipse 42% 38% at 75% 68%, rgba(244, 114, 182, .05) 0%, transparent 52%),
      radial-gradient(ellipse 36% 32% at 18% 72%, rgba(167, 139, 250, .07) 0%, transparent 50%),
      radial-gradient(ellipse 30% 28% at 55% 48%, rgba(52, 211, 153, .04) 0%, transparent 58%);
  }

  [data-theme="dark"] body::after {
    background-image:
      radial-gradient(circle, rgba(255, 255, 255, .05) 1px, transparent 1px),
      radial-gradient(circle, rgba(255, 255, 255, .03) 1.5px, transparent 1.5px);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(ellipse 90% 60% at 15% 0%, rgba(99, 102, 241, .40), transparent 45%),
      radial-gradient(ellipse 70% 50% at 88% 3%, rgba(56, 189, 248, .34), transparent 38%),
      radial-gradient(ellipse 85% 55% at 78% 92%, rgba(244, 114, 182, .30), transparent 40%),
      radial-gradient(ellipse 65% 45% at 12% 88%, rgba(167, 139, 250, .26), transparent 36%),
      radial-gradient(ellipse 75% 50% at 48% 52%, rgba(52, 211, 153, .14), transparent 50%),
      radial-gradient(ellipse 55% 38% at 42% 22%, rgba(251, 191, 36, .10), transparent 45%),
      linear-gradient(168deg, #eef4ff 0%, #e4ebfd 22%, #f3eeff 50%, #fef0f7 76%, #eef4ff 100%);
    padding: 32px 18px 54px;
    transition: background .35s ease, color .35s ease;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: -30%;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse 45% 40% at 28% 32%, rgba(99, 102, 241, .14) 0%, transparent 55%),
      radial-gradient(ellipse 38% 35% at 72% 25%, rgba(56, 189, 248, .11) 0%, transparent 50%),
      radial-gradient(ellipse 42% 38% at 75% 68%, rgba(244, 114, 182, .10) 0%, transparent 52%),
      radial-gradient(ellipse 36% 32% at 18% 72%, rgba(167, 139, 250, .12) 0%, transparent 50%),
      radial-gradient(ellipse 30% 28% at 55% 48%, rgba(52, 211, 153, .07) 0%, transparent 58%);
    animation: orbFloat 28s ease-in-out infinite;
    will-change: transform, opacity;
  }

  body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background-image:
      radial-gradient(circle, rgba(255, 255, 255, .14) 1px, transparent 1px),
      radial-gradient(circle, rgba(255, 255, 255, .07) 1.5px, transparent 1.5px);
    background-size: 44px 44px, 66px 66px;
    background-position: 0 0, 22px 22px;
    mask-image: linear-gradient(to bottom, rgba(0, 0, 0, .35), rgba(0, 0, 0, .25) 25%, rgba(0, 0, 0, .12) 55%, transparent 85%);
  }

  @keyframes orbFloat {
    0%, 100% { opacity: .88; transform: translate(0, 0) scale(1); }
    20% { opacity: 1; transform: translate(2.5%, -2%) scale(1.06); }
    40% { opacity: .72; transform: translate(-1.5%, 2.5%) scale(.94); }
    60% { opacity: .96; transform: translate(-2%, -1.5%) scale(1.04); }
    80% { opacity: .82; transform: translate(1%, 1.5%) scale(.97); }
  }

  button, input, select { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }

  .app {
    width: 100%;
    max-width: 100%;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .hero {
    width: min(980px, 100%);
    margin: 0 auto 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 18px;
    align-items: stretch;
    margin-bottom: 20px;
  }
  .hero-right {
    display: flex;
    flex-direction: column;
    gap: 12px;
    justify-content: flex-start;
    align-items: flex-end;
  }
  .date-greeting {
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .greeting-name { color: var(--primary); font-weight: 800; }
  .today-schedule-card {
    width: 220px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    max-height: calc(100vh - 260px);
  }
  .ts-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 14px;
  }
  .ts-header span {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .ts-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding-right: 4px;
  }
  .ts-list::-webkit-scrollbar { width: 4px; }
  .ts-list::-webkit-scrollbar-thumb { background: rgba(99,102,241,.3); border-radius: 4px; }
  .ts-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    font-size: 13px;
    line-height: 1.4;
    color: var(--text);
  }
  .ts-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    margin-top: 6px;
    flex-shrink: 0;
  }
  .ts-empty {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 12px 0;
  }
  .ts-view-all {
    margin-top: 4px;
    font-size: 12px;
    padding: 8px 10px;
    border-radius: 12px;
  }
  .all-schedule-modal { width: 90%; max-width: 520px; max-height: 70vh; display: flex; flex-direction: column; }
  .all-schedule-modal h3 { display: flex; align-items: center; gap: 10px; }
  .all-schedule-modal h3 span {
    background: linear-gradient(135deg, var(--primary), var(--accent));
    color: white;
    font-size: 12px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .all-schedule-modal .schedule-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 12px;
    overflow-y: auto;
    max-height: 45vh;
    padding-right: 4px;
  }
  .all-schedule-modal .schedule-list::-webkit-scrollbar { width: 5px; }
  .all-schedule-modal .schedule-list::-webkit-scrollbar-thumb { background: rgba(99,102,241,.3); border-radius: 4px; }

  /* ===== 侧边栏小组件 ===== */
  .left-widget, .right-widget { display: none; }
  .widget-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .widget-title { font-size: 15px; font-weight: 800; color: var(--text); }
  .widget-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .widget-metric {
    background: var(--card-solid);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px;
    text-align: center;
  }
  .widget-metric strong { display: block; font-size: 22px; color: var(--primary); margin-bottom: 2px; }
  .widget-metric span { font-size: 12px; color: var(--muted); }
  .widget-section { display: flex; flex-direction: column; gap: 8px; }
  .widget-subtitle { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .priority-bars { display: flex; flex-direction: column; gap: 8px; }
  .p-bar-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .p-bar-row .p-label { width: 42px; color: var(--muted); }
  .p-bar-row .p-track { flex: 1; height: 8px; background: rgba(120,142,180,.15); border-radius: 999px; overflow: hidden; }
  .p-bar-row .p-fill { height: 100%; border-radius: 999px; transition: width .4s var(--ease); }
  .p-bar-row .p-count { width: 20px; text-align: right; color: var(--text); font-weight: 700; }
  .trend-chart { display: flex; align-items: flex-end; justify-content: space-between; gap: 4px; height: 64px; padding-top: 8px; }
  .trend-bar { flex: 1; min-width: 14px; background: linear-gradient(180deg, var(--primary), var(--primary-2)); border-radius: 6px 6px 0 0; opacity: .85; transition: height .4s var(--ease); position: relative; }
  .trend-bar:hover { opacity: 1; }
  .trend-bar::after { content: attr(data-day); position: absolute; bottom: -16px; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--muted); }
  .trend-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 12px 0; }

  @media (min-width: 1400px) {
    body { padding: 32px 28px 54px; }
    .app {
      display: grid;
      grid-template-columns: 240px minmax(0, 980px) 240px;
      gap: 24px;
      max-width: 1540px;
      margin: 0 auto;
    }
    .left-widget, .right-widget { display: flex; flex-direction: column; gap: 16px; }
    .left-widget { grid-column: 1; grid-row: 1 / span 6; position: sticky; top: 32px; height: fit-content; }
    .right-widget { grid-column: 3; grid-row: 1; position: sticky; top: 32px; height: fit-content; max-height: calc(100vh - 64px); }
    .hero, .stats, .schedule-banner, .panel, .progress-card, .todo-list { grid-column: 2; }
    .hero { width: 100%; margin-bottom: 0; }
    .hero-right { justify-content: flex-end; }
    .stats { margin-bottom: 16px; }
  }

  .title-card, .panel {
    background: var(--card);
    border: 1px solid rgba(255,255,255,.45);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    backdrop-filter: blur(18px);
  }

  .title-card { padding: 26px; overflow: hidden; position: relative; }
  .title-card::after {
    content: "";
    position: absolute;
    width: 180px;
    height: 180px;
    right: -60px;
    top: -70px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(99,102,241,.24), rgba(56,189,248,.15));
  }

  .eyebrow { color: var(--primary); font-weight: 800; letter-spacing: .12em; font-size: 12px; text-transform: uppercase; }
  h1 { margin: 8px 0 8px; font-size: clamp(30px, 5vw, 52px); line-height: 1.05; letter-spacing: -1.5px; }
  .subtitle { margin: 0; color: var(--muted); line-height: 1.7; max-width: 580px; }

  .top-actions { display: flex; gap: 10px; align-items: center; }

  .theme-btn, .sound-btn {
    width: 54px;
    height: 54px;
    border: 0;
    border-radius: 18px;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    box-shadow: var(--soft-shadow);
    transition: transform .25s var(--ease), box-shadow .25s var(--ease);
  }
  .theme-btn:hover, .sound-btn:hover { transform: translateY(-3px) rotate(6deg); }

  .stats {
    width: min(980px, 100%);
    margin: 0 auto 16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    padding: 16px;
    border-radius: 22px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--soft-shadow);
  }
  .stat strong { display: block; font-size: 28px; line-height: 1; margin-bottom: 7px; }
  .stat span { color: var(--muted); font-size: 13px; }

  .panel { padding: 18px; margin-bottom: 16px; overflow: visible; }
  .panel:not(.progress-card) { width: min(980px, 100%); margin-left: auto; margin-right: auto; }
  .panel.progress-card { width: 100%; }
  .composer { display: grid; grid-template-columns: 1fr 140px auto auto; gap: 10px; overflow: visible; }
  .input, .select {
    width: 100%;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.65);
    color: var(--text);
    border-radius: 18px;
    padding: 14px 15px;
    outline: none;
    transition: border .2s ease, box-shadow .2s ease, transform .2s ease;
  }
  [data-theme="dark"] .input, [data-theme="dark"] .select { background: rgba(15, 23, 42, .62); }
  .input:focus, .select:focus { border-color: rgba(59,130,246,.75); box-shadow: 0 0 0 5px rgba(59,130,246,.13); }

  .datetime-picker {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 120px;
  }
  .datetime-input {
    width: 48px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.65);
    color: transparent;
    border-radius: 18px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
    transition: border .2s ease, box-shadow .2s ease, width .2s ease;
    text-align: center;
  }
  .datetime-input:not(:placeholder-shown) {
    color: var(--text);
    text-align: left;
    width: 150px;
  }
  .datetime-input::placeholder {
    color: transparent;
  }
  [data-theme="dark"] .datetime-input { background: rgba(15, 23, 42, .62); }
  .datetime-input:focus { border-color: rgba(59,130,246,.75); box-shadow: 0 0 0 5px rgba(59,130,246,.13); }
  .datetime-input::-webkit-calendar-picker-indicator {
    width: 28px;
    height: 28px;
    cursor: pointer;
    opacity: 1;
    margin: 0;
  }
  .datetime-input::-webkit-datetime-edit {
    display: none;
  }
  .datetime-input:not(:placeholder-shown)::-webkit-datetime-edit {
    display: inline;
  }

  .custom-select {
    position: relative;
    width: 100%;
  }
  .select-trigger {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.65);
    color: var(--text);
    border-radius: 18px;
    padding: 14px 15px;
    cursor: pointer;
    transition: border .2s ease, box-shadow .2s ease;
  }
  [data-theme="dark"] .select-trigger { background: rgba(15, 23, 42, .62); }
  .custom-select:focus-within .select-trigger { border-color: rgba(59,130,246,.75); box-shadow: 0 0 0 5px rgba(59,130,246,.13); }
  .select-arrow { font-size: 12px; color: var(--muted); transition: transform .22s var(--ease); }
  .custom-select.open .select-arrow { transform: rotate(180deg); }
  .select-options {
    position: absolute;
    bottom: calc(100% + 8px);
    left: 0;
    right: 0;
    background: var(--card-solid);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 8px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(8px) scale(.98);
    transition: opacity .25s var(--ease), transform .25s var(--ease), visibility .25s;
    z-index: 100;
  }
  .custom-select.open .select-options {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }
  .select-option {
    width: 100%;
    padding: 12px 16px;
    border: 0;
    border-radius: 14px;
    background: transparent;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: background .18s ease, color .18s ease;
  }
  .select-option:hover { background: rgba(59,130,246,.1); }
  .select-option.active {
    background: rgba(59,130,246,.75);
    color: white;
  }

  .add-btn, .ghost-btn, .filter-btn, .icon-btn {
    border: 0;
    cursor: pointer;
    border-radius: 18px;
    transition: transform .22s var(--ease), box-shadow .22s var(--ease), background .22s ease, opacity .22s ease;
  }
  .add-btn {
    padding: 0 22px;
    min-height: 50px;
    color: white;
    font-weight: 800;
    background: linear-gradient(135deg, var(--primary), var(--primary-2));
    box-shadow: 0 14px 30px rgba(99,102,241,.28);
  }
  .add-btn:hover, .ghost-btn:hover, .filter-btn:hover, .icon-btn:hover { transform: translateY(-2px); }
  .add-btn:active, .ghost-btn:active, .filter-btn:active, .icon-btn:active { transform: scale(.97); }

  .toolbar {
    display: grid;
    grid-template-columns: minmax(180px, 1fr) auto auto;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
  }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn, .ghost-btn {
    padding: 11px 14px;
    background: rgba(255,255,255,.58);
    color: var(--muted);
    border: 1px solid var(--line);
  }
  [data-theme="dark"] .filter-btn, [data-theme="dark"] .ghost-btn { background: rgba(15,23,42,.55); }
  .filter-btn.active { color: white; border-color: transparent; background: linear-gradient(135deg, var(--primary), var(--accent)); box-shadow: 0 12px 24px rgba(99,102,241,.2); }

  .progress-card { padding: 18px; }
  .progress-top { display: flex; justify-content: space-between; gap: 14px; margin-bottom: 10px; color: var(--muted); font-size: 14px; }
  .progress-top strong { color: var(--text); }
  .track { height: 13px; background: rgba(125,138,163,.18); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 0%; border-radius: inherit; background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--success)); transition: width .55s var(--ease); position: relative; }
  .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); animation: shine 2.2s infinite; }

  .todo-list { display: grid; grid-template-columns: 1fr; gap: 12px; margin-top: 16px; }
  @media (min-width: 1100px) {
    .todo-list { grid-template-columns: repeat(2, 1fr); }
  }
  .todo { overflow: hidden; transition: opacity .3s ease, transform .3s var(--ease); }
  .todo.deleting { opacity: 0; transform: translateX(50px) scale(.96); pointer-events: none; }
  .completed-section { margin-top: 8px; grid-column: 1 / -1; }
  .completed-header {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; cursor: pointer;
    border-radius: 18px; color: var(--muted);
    background: var(--card); border: 1px dashed var(--line);
    font-size: 14px; font-weight: 700;
    transition: background .2s ease, color .2s ease;
    user-select: none;
  }
  .completed-header:hover { background: rgba(255,255,255,.85); color: var(--text); }
  [data-theme="dark"] .completed-header:hover { background: rgba(30,40,60,.7); }
  .completed-header .arrow { transition: transform .25s var(--ease); font-size: 12px; }
  .completed-header.open .arrow { transform: rotate(90deg); }
  .completed-body { overflow: hidden; max-height: 0; transition: max-height .35s var(--ease), opacity .25s ease; opacity: 0; }
  .completed-body.open { max-height: 4000px; opacity: 1; margin-top: 12px; }
  .todo {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 14px;
    align-items: center;
    padding: 16px;
    border-radius: 24px;
    background: var(--card);
    border: 1px solid var(--line);
    box-shadow: var(--soft-shadow);
    animation: pop .28s var(--ease) both;
  }
  .todo.done { opacity: .82; }
  .stages { display: flex; flex-direction: column; gap: 6px; align-items: center; padding: 4px 0; }
  .stage-dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid var(--line);
    background: rgba(255,255,255,.5);
    cursor: pointer;
    display: grid; place-items: center;
    font-size: 13px; color: transparent;
    transition: all .22s var(--ease);
    position: relative;
  }
  [data-theme="dark"] .stage-dot { background: rgba(15,23,42,.5); }
  .stage-dot:hover { transform: scale(1.18); border-color: var(--primary); }
  .stage-dot.done { background: linear-gradient(135deg, var(--success), #86efac); color: white; border-color: transparent; }
  .stage-dot::after {
    content: attr(data-label);
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);

  .stage-dot:hover::after { opacity: 1; }

  .badge { font-size: 12px; padding: 4px 8px; border-radius: 999px; color: white; flex: 0 0 auto; }

  .actions { display: flex; gap: 8px; }
  .icon-btn { width: 38px; height: 38px; color: var(--muted); background: rgba(255,255,255,.55); border: 1px solid var(--line); }
  [data-theme="dark"] .icon-btn { background: rgba(15,23,42,.5); }

  .empty {

  .toast {
    position: fixed;

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 10; }
  .dot { position: absolute; width: 10px; height: 10px; border-radius: 999px; animation: fly .8s ease-out forwards; }

  @keyframes shine { to { transform: translateX(110%); } }
  @keyframes pop { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes fly { to { opacity: 0; transform: translate(var(--x), var(--y)) rotate(420deg) scale(.3); } }
  @keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }

  [data-theme="dark"] .checkin-num { background: rgba(15,23,42,.62); }
  .checkin-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: rgba(99,102,241,.12); color: var(--primary); font-weight: 700; }
  .checkin-btn { font-size: 12px; padding: 6px 12px; border-radius: 999px; border: 0; cursor: pointer; background: linear-gradient(135deg, var(--success), #34d399); color: white; font-weight: 700; transition: transform .2s ease; }
  .checkin-btn:hover { transform: translateY(-2px); }

</style>

  <div class="toast" id="toast"></div>

<script>
const STORAGE_KEY = 'polished_todos_v4';
const SCHEDULE_KEY = 'polished_schedules_v1';
const SOUND_KEY = 'todo_sound_enabled';
const LEGACY_KEYS = ['polished_todos_v3', 'qclaw_todos_v2'];
const STAGE_NAMES = ['1/4', '2/4', '3/4', '4/4'];
const $ = (selector) => document.querySelector(selector);

let todos = loadTodos();
let schedules = loadSchedules();
let filter = 'all';
let search = '';
let completedCollapsed = true;

function loadSchedules() {
  const raw = localStorage.getItem(SCHEDULE_KEY);
  if (!raw) return [];
  try {
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : [];
  } catch (e) { return []; }
}

function saveSchedules() {
  localStorage.setItem(SCHEDULE_KEY, JSON.stringify(schedules));
}

function todaySchedules() {
  const tk = todayKey();
  return schedules.filter((s) => s.date === tk);
}

function upcomingSchedules(days = 7) {
  const tk = todayKey();
  const start = new Date(tk);
  start.setHours(0, 0, 0, 0);
  const end = new Date(start);
  end.setDate(end.getDate() + days);
  return schedules
    .filter((s) => {
      const d = new Date(s.date);
      d.setHours(0, 0, 0, 0);
      return d >= start && d <= end;
    })
    .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}

function renderBanner() {
  const today = todaySchedules();
  const banner = $('#scheduleBanner');
  const track = $('#scheduleBannerTrack');
  if (!today.length) { banner.classList.remove('show'); return; }
  banner.classList.add('show');
  const itemHtml = (s) => '<span class="item"><span class="date">📌 今天</span><span class="txt">' + escapeHtml(s.text) + '</span><span class="del" data-sid="' + s.id + '" title="删除">✕</span></span>';
  const seq = today.map(itemHtml).join('');
  track.innerHTML = seq + seq;
}

function renderTodayScheduleList() {
  const list = $('#todayScheduleList');
  const count = $('#todayScheduleCount');
  count.textContent = schedules.length;
  if (!schedules.length) {
    list.innerHTML = '<div class="ts-empty">还没有日程</div>';
    return;
  }
  const sorted = [...schedules].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  list.innerHTML = sorted.map((s) => {
    const isToday = s.date === todayKey();
    const label = isToday ? '今天' : formatDate(s.date);
    return '<div class="ts-item">' +
      '<span class="ts-dot"></span>' +
      '<span><strong>' + label + '</strong> ' + escapeHtml(s.text) + '</span>' +
    '</div>';
  }).join('');
}

function renderAllScheduleList() {
  const list = $('#allScheduleList');
  const count = $('#allScheduleCount');
  count.textContent = schedules.length;
  if (!schedules.length) {
    list.innerHTML = '<div class="empty" style="padding:20px 0"><span class="moon">🗓️</span><strong>还没有日程</strong><p>点击右上角「＋ 日程」添加提醒。</p></div>';
    return;
  }
  const sorted = [...schedules].sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  list.innerHTML = sorted.map((s) => {
    const isToday = s.date === todayKey();
    return '<div class="schedule-item ' + (isToday ? 'today' : '') + '">' +
      '<span class="s-date">' + (isToday ? '今天' : formatDate(s.date)) + '</span>' +
      '<span class="s-text">' + escapeHtml(s.text) + '</span>' +
      '<button class="icon-btn danger" data-sid="' + s.id + '" title="删除">×</button>' +
      '</div>';
  }).join('');
}

function openAllScheduleModal() {
  renderAllScheduleList();
  $('#allScheduleModal').style.display = 'flex';
}

function closeAllScheduleModal() {
  $('#allScheduleModal').style.display = 'none';
}

function renderGreeting() {
  const now = new Date();
  const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const dateText = now.getFullYear() + '年' + (now.getMonth()+1) + '月' + now.getDate() + '日 ' + weekdays[now.getDay()];
  const hour = now.getHours();
  let period = '早上好';
  if (hour >= 11 && hour < 13) period = '中午好';
  else if (hour >= 13 && hour < 18) period = '下午好';
  else if (hour >= 18) period = '晚上好';
  const el = $('#dateGreeting');
  if (el) el.innerHTML = '<span>' + dateText + '</span><span class="greeting-name">' + period + '，千 ✋</span>';
}

function addSchedule(date, text) {
  schedules.push({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
    date: date,
    text: text,
    createdAt: Date.now()
  });
  saveSchedules();
  renderBanner();
  renderTodayScheduleList();
  playSound('add');
  showToast('已添加日程');
}

function deleteSchedule(id) {
  schedules = schedules.filter((s) => s.id !== id);
  saveSchedules();
  renderBanner();
  renderTodayScheduleList();
  showToast('已删除日程');
}

function openScheduleModal() {
  $('#scheduleDateInput').value = todayKey();
  $('#scheduleTextInput').value = '';
  $('#scheduleModal').style.display = 'flex';
  $('#scheduleTextInput').focus();
}

function closeScheduleModal() {
  $('#scheduleModal').style.display = 'none';
}

const priorityMap = {
  high: { label: '高', className: 'high', weight: 0 },
  medium: { label: '普通', className: 'medium', weight: 1 },
  low: { label: '低', className: 'low', weight: 2 }
};

function loadTodos() {
  const current = localStorage.getItem(STORAGE_KEY);
  if (current) {
    const data = JSON.parse(current);
    return data.map(migrateTodo);
  }

  for (const key of LEGACY_KEYS) {
    const legacy = localStorage.getItem(key);
    if (!legacy) continue;
    try {
      return JSON.parse(legacy).map(migrateTodo);
    } catch (error) {}
  }
  return [];
}

function migrateTodo(item) {
  if (!Array.isArray(item.stages)) {
    item.stages = [Boolean(item.done), false, false, false];
  }
  while (item.stages.length < 4) item.stages.push(false);
  if (!item.checkIn || typeof item.checkIn !== 'object') {
    item.checkIn = { enabled: false, intervalDays: 1, lastDoneAt: null };
  }
  return item;
}

function isDone(todo) {
  return todo.stages.every(Boolean);
}

function dateKey(d) {
  const date = new Date(d);
  const yyyy = date.getFullYear();
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  return `${yyyy}-${mm}-${dd}`;
}

function todayKey() {
  return dateKey(new Date());
}

function getCheckinStatus(todo) {
  if (!todo.checkIn || !todo.checkIn.enabled) return null;
  const days = Number(todo.checkIn.intervalDays) || 1;
  if (!todo.checkIn.lastDoneAt) {
    return { text: '今天可打卡', due: true, canCheck: true };
  }
  const last = new Date(todo.checkIn.lastDoneAt);
  const today = new Date();
  last.setHours(0, 0, 0, 0);
  today.setHours(0, 0, 0, 0);
  const diffDays = Math.floor((today - last) / 86400000);
  const nextIn = days - diffDays;
  if (nextIn <= 0) return { text: '今天可打卡', due: true, canCheck: true };
  if (isDone(todo)) return { text: `已打卡 · 还有 ${nextIn} 天`, due: false, canCheck: false };
  return { text: `还有 ${nextIn} 天`, due: false, canCheck: false };
}

function resetCheckinIfNeeded(todo) {
  if (!todo.checkIn || !todo.checkIn.enabled || !todo.checkIn.lastDoneAt || !isDone(todo)) return false;
  const days = Number(todo.checkIn.intervalDays) || 1;
  const next = new Date(todo.checkIn.lastDoneAt);
  next.setDate(next.getDate() + days);
  if (todayKey() >= dateKey(next)) {
    todo.stages = [false, false, false, false];
    todo.completedAt = null;
    return true;
  }
  return false;
}

function applyCheckinResets() {
  let changed = false;
  todos.forEach((todo) => { if (resetCheckinIfNeeded(todo)) changed = true; });
  if (changed) saveTodos();
}

function doCheckin(id) {
  const todo = todos.find((item) => item.id === id);
  if (!todo || !todo.checkIn || !todo.checkIn.enabled) return;
  const status = getCheckinStatus(todo);
  if (!status || !status.canCheck) return showToast('今天还不能打卡哦');
  todo.stages = [true, true, true, true];
  todo.completedAt = Date.now();
  todo.checkIn.lastDoneAt = Date.now();
  saveTodos();
  render();
  playSound('complete');
  showToast('🎉 打卡成功！');
  const el = document.querySelector(`.todo[data-id="${id}"]`);
  if (el) {
    const r = el.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
  }
}

function saveTodos() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
}

function formatDate(value) {
  if (!value) return '';
  const date = new Date(value);
  const year = date.getFullYear();
  const month = date.getMonth() + 1;
  const day = date.getDate();
  return `${year}年${month}月${day}日`;
}

function dueState(value, done) {
  if (!value || done) return '';
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const due = new Date(value);
  const diff = Math.round((due - today) / 86400000);
  if (diff < 0) return 'overdue';
  if (diff === 0) return 'today';
  return '';
}

function escapeHtml(value) {
  return value.replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[char]));
}

function getVisibleTodos() {
  return [...todos]
    .sort((a, b) => Number(isDone(a)) - Number(isDone(b)) || priorityMap[a.priority].weight - priorityMap[b.priority].weight || new Date(a.due || '2999-12-31') - new Date(b.due || '2999-12-31') || b.createdAt - a.createdAt)
    .filter((todo) => filter === 'all' || (filter === 'done' ? isDone(todo) : !isDone(todo)))
    .filter((todo) => todo.text.toLowerCase().includes(search.toLowerCase()));
}

function startOfDay(ts) {
  const d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function startOfWeek(ts) {
  const d = new Date(ts);
  const day = d.getDay() || 7;
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - day + 1);
  return d.getTime();
}

function renderStatsPanel() {
  const now = Date.now();
  const todayTs = startOfDay(now);
  const weekTs = startOfWeek(now);
  const todayDone = todos.filter((t) => t.completedAt && startOfDay(t.completedAt) >= todayTs).length;
  const weekDone = todos.filter((t) => t.completedAt && startOfDay(t.completedAt) >= weekTs).length;
  const pMap = { high: "高", medium: "中", low: "低" };
  const pColor = { high: "var(--danger)", medium: "var(--warning)", low: "var(--success)" };
  const counts = { high: 0, medium: 0, low: 0 };
  todos.forEach((t) => { counts[t.priority] = (counts[t.priority] || 0) + 1; });
  const total = todos.length;
  let barsHtml = "";
  ["high", "medium", "low"].forEach((p) => {
    const c = counts[p] || 0;
    const pct = total ? Math.round((c / total) * 100) : 0;
    barsHtml += "<div class=\"p-bar-row\">" +
      "<span class=\"p-label\">" + pMap[p] + "</span>" +
      "<div class=\"p-track\"><div class=\"p-fill\" style=\"width:" + pct + "%;background:" + pColor[p] + "\"></div></div>" +
      "<span class=\"p-count\">" + c + "</span>" +
      "</div>";
  });
  $("#priorityBars").innerHTML = barsHtml;

  const trend = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(todayTs);
    d.setDate(d.getDate() - i);
    const dayTs = d.getTime();
    const dayDone = todos.filter((t) => t.completedAt && startOfDay(t.completedAt) === dayTs).length;
    trend.push({ day: d.getDate() + "日", count: dayDone });
  }
  const maxCount = Math.max(...trend.map((x) => x.count), 1);
  const trendHtml = trend.map((x) =>
    "<div class=\"trend-bar\" style=\"height:" + Math.max(4, Math.round((x.count / maxCount) * 56)) + "px\" data-day=\"" + x.day + "\" title=\"" + x.day + " 完成 " + x.count + " 项\"></div>"
  ).join("");
  $("#trendChart").innerHTML = trendHtml || "<div class=\"trend-empty\">暂无数据</div>";

  $("#statToday").textContent = todayDone;
  $("#statWeek").textContent = weekDone;
}

function render() {
  applyCheckinResets();
  const total = todos.length;
  const done = todos.filter((todo) => isDone(todo)).length;
  const active = total - done;
  const rate = total ? Math.round((done / total) * 100) : 0;

  $('#statTotal').textContent = total;
  $('#statActive').textContent = active;
  $('#statDone').textContent = done;
  $('#statRate').textContent = `${rate}%`;
  $('#progressFill').style.width = `${rate}%`;
  $('#progressLabel').textContent = total ? `${done}/${total} 已完成` : '还没开始';

  renderGreeting();
  renderStatsPanel();
  renderTodayScheduleList();

  document.querySelectorAll('.filter-btn').forEach((button) => button.classList.toggle('active', button.dataset.filter === filter));

  const visible = getVisibleTodos();
  const activeTodos = visible.filter((todo) => !isDone(todo));
  const doneTodos = visible.filter((todo) => isDone(todo));

  if (!visible.length) {
    $('#todoList').innerHTML = `<div class="empty"><span class="moon">${todos.length ? '🔍' : '🌙'}</span><strong>${todos.length ? '没有匹配的任务' : '清单空空，脑袋轻轻'}</strong><p>${todos.length ? '换个关键词或筛选条件看看。' : '从一个很小的下一步开始，事情就会动起来。'}</p></div>`;
    return;
  }

  const todoHtml = (todo) => {
    const priority = priorityMap[todo.priority] || priorityMap.medium;
    const done = isDone(todo);
    const dueClass = dueState(todo.due, done);
    const stagesHtml = STAGE_NAMES.map((name, i) =>
      `<button class="stage-dot ${todo.stages[i] ? 'done' : ''}" data-action="stage" data-stage="${i}" data-label="${name}" title="${name}">✓</button>`
    ).join('');
    const doneCount = todo.stages.filter(Boolean).length;
    return `
      <article class="todo ${done ? 'done' : ''}" data-id="${todo.id}">
        <div class="stages">${stagesHtml}</div>
        <div class="todo-content">
          <div class="todo-title">
            <span class="todo-text">${escapeHtml(todo.text)}</span>
            <span class="badge ${priority.className}">${priority.label}</span>
          </div>
          <div class="meta">
            <span>${done ? '✅ 已完成' : `${doneCount}/4 阶段`}</span>
            ${todo.start || todo.due ? `<span class="due ${dueClass}">${todo.start && todo.due ? `${formatDate(todo.start)} → ${formatDate(todo.due)}` : todo.due ? `截止: ${formatDate(todo.due)}` : `开始: ${formatDate(todo.start)}`}</span>` : ''}
            ${(() => { const ci = getCheckinStatus(todo); if (!ci) return ''; const badge = `<span class="checkin-badge">\ud83d\udd01 每${todo.checkIn.intervalDays}天</span>`; return `${badge}<span class="checkin-status ${ci.due ? 'due' : (done ? 'done' : 'wait')}">${ci.text}</span>`; })()}
          </div>
        </div>
        <div class="actions">
          ${todo.checkIn && todo.checkIn.enabled ? `<button class="icon-btn checkin-btn" data-action="checkin" title="打卡" ${!getCheckinStatus(todo).canCheck ? 'disabled' : ''}>\u2713</button>` : ''}
          <button class="icon-btn edit" data-action="edit" title="编辑">✎</button>
          <button class="icon-btn danger" data-action="delete" title="删除">×</button>
        </div>
      </article>`;
  };

  let html = activeTodos.map(todoHtml).join('');

  if (doneTodos.length) {
    html += `
      <div class="completed-section">
        <div class="completed-header ${completedCollapsed ? '' : 'open'}" id="completedToggle">
          <span class="arrow">▶</span>
          <span>已完成（${doneTodos.length}）</span>
        </div>
        <div class="completed-body ${completedCollapsed ? '' : 'open'}" id="completedBody">
          ${doneTodos.map(todoHtml).join('')}
        </div>
      </div>`;
  }

  $('#todoList').innerHTML = html;
}

function showToast(message) {
  const toast = $('#toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 1700);
}

let soundEnabled = localStorage.getItem(SOUND_KEY) !== 'false';
let audioCtx = null;

function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playSound(type) {
  if (!soundEnabled) return;
  const ctx = getAudioCtx();
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;

  if (type === 'add') {
    const notes = [880, 1100, 1320];
    notes.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain).connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      const t = now + i * 0.05;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.3, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      osc.start(t);
      osc.stop(t + 0.2);
    });
  }

  if (type === 'complete') {
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const osc2 = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      osc2.connect(gain);
      gain.connect(ctx.destination);
      osc.type = 'sine';
      osc.frequency.value = freq;
      osc2.type = 'triangle';
      osc2.frequency.value = freq * 2;
      const t = now + i * 0.1;
      gain.gain.setValueAtTime(0.5, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      osc.start(t); osc.stop(t + 0.35);
      osc2.start(t); osc2.stop(t + 0.35);
    });
  }

  if (type === 'undo') {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain).connect(ctx.destination);
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(700, now);
    osc.frequency.exponentialRampToValueAtTime(440, now + 0.14);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.22);
    osc.start(now);
    osc.stop(now + 0.25);
  }

  if (type === 'delete') {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain).connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(500, now);
    osc.frequency.exponentialRampToValueAtTime(120, now + 0.22);
    gain.gain.setValueAtTime(0.45, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    osc.start(now);
    osc.stop(now + 0.3);
  }

  if (type === 'stage') {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain).connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, now);
    osc.frequency.exponentialRampToValueAtTime(900, now + 0.08);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
    osc.start(now);
    osc.stop(now + 0.18);
  }

  if (type === 'edit') {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain).connect(ctx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(700, now);
    osc.frequency.setValueAtTime(1050, now + 0.08);
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.start(now);
    osc.stop(now + 0.22);
  }
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  localStorage.setItem(SOUND_KEY, soundEnabled);
  $('#soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
  showToast(soundEnabled ? '音效已开启' : '音效已关闭');
}

function initSound() {
  $('#soundBtn').textContent = soundEnabled ? '🔊' : '🔇';
}

function burst(x, y) {
  const colors = ['#6366f1', '#38bdf8', '#f472b6', '#22c55e', '#f59e0b'];
  for (let index = 0; index < 24; index++) {
    const dot = document.createElement('span');
    const angle = (Math.PI * 2 * index) / 24;
    const distance = 70 + Math.random() * 90;
    dot.className = 'dot';
    dot.style.left = `${x}px`;
    dot.style.top = `${y}px`;
    dot.style.background = colors[index % colors.length];
    dot.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
    dot.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
    $('#confetti').appendChild(dot);
    setTimeout(() => dot.remove(), 850);
  }
}

function addTodo() {
  const input = $('#taskInput');
  const text = input.value.trim();
  if (!text) {
    input.style.animation = 'none';
    input.offsetHeight;
    input.style.animation = 'shake .35s ease';
    input.focus();
    return;
  }

  const exists = todos.some((item) => item.text === text);
  if (exists) {
    showToast('任务名称重复，请修改');
    input.style.animation = 'none';
    input.offsetHeight;
    input.style.animation = 'shake .35s ease';
    input.focus();
    return;
  }

  todos.push({
    id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()),
    text,
    priority: $('#priorityInput .select-option.active').dataset.value,
    due: $('#endInput').value,
    start: $('#startInput').value,
    createdAt: Date.now(),
    completedAt: null,
    stages: [false, false, false, false],
    checkIn: {
      enabled: $('#checkinEnabled').checked,
      intervalDays: Math.max(1, parseInt($('#checkinInterval').value, 10) || 1),
      lastDoneAt: null
    }
  });
  input.value = '';
  $('#startInput').value = '';
  $('#endInput').value = '';
  $('#checkinEnabled').checked = false;
  $('#checkinInterval').disabled = true;
  $('#checkinLabel').style.opacity = '0.5';
  $('#checkinLabel').style.pointerEvents = 'none';
  saveTodos();
  render();
  playSound('add');
  showToast('已添加到清单');
  input.focus();
}

function toggleStage(id, stageIndex) {
  const todo = todos.find((item) => item.id === id);
  if (!todo) return;
  const wasDone = isDone(todo);
  const targetDone = !todo.stages[stageIndex];
  if (targetDone) {
    for (let i = 0; i <= stageIndex; i++) {
      todo.stages[i] = true;
    }
  } else {
    for (let i = stageIndex; i < todo.stages.length; i++) {
      todo.stages[i] = false;
    }
  }
  const nowDone = isDone(todo);
  todo.completedAt = nowDone ? Date.now() : null;
  saveTodos();
  render();
  if (nowDone && !wasDone) {
    playSound('complete');
    showToast('🎉 全部阶段完成，太棒了！');
    const el = document.querySelector(`.todo[data-id="${id}"]`);
    if (el) { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); }
  } else if (!nowDone && wasDone) {
    playSound('undo');
    showToast('已取消完成');
  } else {
    playSound('stage');
    const doneCount = todo.stages.filter(Boolean).length;
    showToast(`${STAGE_NAMES[stageIndex]} ${targetDone ? '已完成' : '已取消'}（${doneCount}/4）`);
  }
}

let editingTodoId = null;

function editTodo(id) {
  const todo = todos.find((item) => item.id === id);
  if (!todo) return;
  editingTodoId = id;
  $('#editTextInput').value = todo.text;
  $('#editStartInput').value = todo.start || '';
  $('#editEndInput').value = todo.due || '';
  $('#editCheckinEnabled').checked = !!(todo.checkIn && todo.checkIn.enabled);
  $('#editCheckinInterval').value = (todo.checkIn && todo.checkIn.intervalDays) || 1;
  $('#editCheckinInterval').disabled = !$('#editCheckinEnabled').checked;
  $('#editCheckinLabel').style.opacity = $('#editCheckinEnabled').checked ? '1' : '0.5';
  $('#editCheckinLabel').style.pointerEvents = $('#editCheckinEnabled').checked ? 'auto' : 'none';
  $('#editModal').style.display = 'flex';
}

function closeEditModal() {
  $('#editModal').style.display = 'none';
  editingTodoId = null;
}

function saveEdit() {
  if (!editingTodoId) return;
  const todo = todos.find((item) => item.id === editingTodoId);
  if (!todo) return;
  const text = $('#editTextInput').value.trim();
  if (!text) return showToast('任务内容不能为空');
  const exists = todos.some((item) => item.id !== editingTodoId && item.text === text);
  if (exists) return showToast('任务名称重复，请修改');
  todo.text = text;
  todo.start = $('#editStartInput').value;
  todo.due = $('#editEndInput').value;
  todo.checkIn = {
    enabled: $('#editCheckinEnabled').checked,
    intervalDays: Math.max(1, parseInt($('#editCheckinInterval').value, 10) || 1),
    lastDoneAt: (todo.checkIn && todo.checkIn.lastDoneAt) || null
  };
  saveTodos();
  render();
  playSound('edit');
  showToast('已更新任务');
  closeEditModal();
}

$('#cancelEditBtn').addEventListener('click', closeEditModal);
$('#saveEditBtn').addEventListener('click', saveEdit);
$('#editModal').addEventListener('click', (e) => {
  if (e.target === $('#editModal')) closeEditModal();
});

function deleteTodo(id) {
  const todo = todos.find((item) => item.id === id);
  if (!todo || !confirm(`删除「${todo.text}」吗？`)) return;
  const el = document.querySelector(`.todo[data-id="${id}"]`);
  if (el) {
    el.classList.add('deleting');
    setTimeout(() => {
      todos = todos.filter((item) => item.id !== id);
      saveTodos();
      render();
      showToast('已删除任务');
    }, 320);
  } else {
    todos = todos.filter((item) => item.id !== id);
    saveTodos();
    render();
    showToast('已删除任务');
  }
}

function clearDone() {
  const count = todos.filter((todo) => isDone(todo)).length;
  if (!count) return showToast('还没有已完成任务');
  if (!confirm(`清除 ${count} 个已完成任务吗？`)) return;
  const doneEls = document.querySelectorAll('.todo.done');
  if (doneEls.length) {
    doneEls.forEach((el) => el.classList.add('deleting'));
    setTimeout(() => {
      todos = todos.filter((todo) => !isDone(todo));
      saveTodos();
      render();
      showToast('已清除完成项');
    }, 320);
  } else {
    todos = todos.filter((todo) => !isDone(todo));
    saveTodos();
    render();
    showToast('已清除完成项');
  }
}

function initTheme() {
  const saved = localStorage.getItem('todo_theme');
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = saved || (prefersDark ? 'dark' : 'light');
  $('#themeBtn').textContent = document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙';
}

function toggleTheme() {
  const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  localStorage.setItem('todo_theme', next);
  $('#themeBtn').textContent = next === 'dark' ? '☀️' : '🌙';
}

  const header = event.target.closest('#completedToggle');
  if (header) {
    completedCollapsed = !completedCollapsed;
    render();
    return;
  }
  const button = event.target.closest('[data-action]');
  if (!button) return;
  const item = button.closest('.todo');
  const id = item.dataset.id;
  if (button.dataset.action === 'stage') toggleStage(id, Number(button.dataset.stage));
  if (button.dataset.action === 'edit') editTodo(id);
  if (button.dataset.action === 'delete') deleteTodo(id);
  if (button.dataset.action === 'checkin') doCheckin(id);
});

$('#soundBtn').addEventListener('click', toggleSound);

$('#cancelScheduleBtn').addEventListener('click', closeScheduleModal);

  const date = $('#scheduleDateInput').value;
  const text = $('#scheduleTextInput').value.trim();
  if (!date) return showToast('请选择日期');

});

$('#viewAllScheduleBtn').addEventListener('click', openAllScheduleModal);
$('#closeAllScheduleBtn').addEventListener('click', closeAllScheduleModal);
$('#allScheduleModal').addEventListener('click', (e) => { if (e.target === $('#allScheduleModal')) closeAllScheduleModal(); });
$('#allScheduleList').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-sid]');
  if (btn) {
    deleteSchedule(btn.dataset.sid);
    renderAllScheduleList();
  }
});

initTheme();
initSound();
applyCheckinResets();
render();
renderBanner();
renderTodayScheduleList();

function bindCheckinToggle(boxId, numId, labelId) {
  const box = $(boxId);
  const num = $(numId);
  const label = $(labelId);
  box.addEventListener('change', () => {
    num.disabled = !box.checked;
    label.style.opacity = box.checked ? '1' : '0.5';
    label.style.pointerEvents = box.checked ? 'auto' : 'none';
  });
}
bindCheckinToggle('#checkinEnabled', '#checkinInterval', '#checkinLabel');
bindCheckinToggle('#editCheckinEnabled', '#editCheckinInterval', '#editCheckinLabel');
